<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VCT VOD HUB V3</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

:root{
    --red:#ff4655;
    --red-dark:#d93645;
    --bg:#080a0f;
    --bg2:#0d1118;
    --card:#111722;
    --card2:#151c28;
    --border:#242d3a;
    --text:#f4f5f7;
    --muted:#8e98a8;
    --green:#35d07f;
    --blue:#4da3ff;
    --yellow:#ffd166;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top right,rgba(255,70,85,.08),transparent 30%),
        linear-gradient(180deg,#080a0f,#0b0e14 45%,#080a0f);
    color:var(--text);
    font-family:"Segoe UI",Arial,sans-serif;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================
   HEADER
========================= */

header{
    border-bottom:1px solid var(--border);
    background:rgba(8,10,15,.94);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:50;
}

.header-inner{
    max-width:1500px;
    margin:auto;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-mark{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--red);
    color:white;
    font-weight:900;
    font-size:19px;
    clip-path:polygon(0 0,100% 0,82% 100%,0 100%);
}

.brand h1{
    margin:0;
    font-size:24px;
    letter-spacing:1px;
}

.brand h1 span{
    color:var(--red);
}

.brand p{
    margin:3px 0 0;
    color:var(--muted);
    font-size:12px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.status{
    color:var(--muted);
    font-size:12px;
    margin-right:4px;
}

.btn{
    border:1px solid var(--border);
    background:#141a24;
    color:var(--text);
    padding:10px 14px;
    border-radius:7px;
    transition:.2s;
}

.btn:hover{
    border-color:#3a4658;
    background:#1a2230;
}

.btn-primary{
    background:var(--red);
    border-color:var(--red);
    color:white;
    font-weight:700;
}

.btn-primary:hover{
    background:var(--red-dark);
    border-color:var(--red-dark);
}

.btn-danger{
    background:#291318;
    border-color:#63252e;
    color:#ff8993;
}

.btn-small{
    padding:7px 10px;
    font-size:12px;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1500px;
    margin:auto;
    padding:26px 24px 60px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:22px;
}

.stat{
    background:linear-gradient(145deg,#111722,#0e131c);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    position:relative;
    overflow:hidden;
}

.stat:after{
    content:"";
    position:absolute;
    right:-25px;
    bottom:-35px;
    width:90px;
    height:90px;
    border-radius:50%;
    background:rgba(255,70,85,.05);
}

.stat-label{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-value{
    font-size:29px;
    font-weight:800;
    margin-top:5px;
}

/* =========================
   NAV
========================= */

.main-nav{
    display:flex;
    gap:5px;
    border-bottom:1px solid var(--border);
    margin-bottom:20px;
}

.nav-btn{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:13px 18px;
    border-bottom:2px solid transparent;
    font-weight:700;
}

.nav-btn:hover{
    color:white;
}

.nav-btn.active{
    color:white;
    border-bottom-color:var(--red);
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:grid;
    grid-template-columns:2fr repeat(4,1fr) 1fr;
    gap:10px;
    margin-bottom:22px;
}

.control{
    background:#111722;
    border:1px solid var(--border);
    color:white;
    border-radius:7px;
    padding:11px 12px;
    outline:none;
    min-width:0;
}

.control:focus{
    border-color:#56667b;
}

input::placeholder{
    color:#697587;
}

/* =========================
   VOD GRID
========================= */

.vod-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:17px;
}

.card{
    background:linear-gradient(145deg,#111722,#0e131b);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-width:0;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:#394656;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.thumbnail{
    height:190px;
    position:relative;
    background:#090c11;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.thumbnail:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.8));
    pointer-events:none;
}

.play-badge{
    position:absolute;
    z-index:2;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:54px;
    height:54px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,70,85,.94);
    color:white;
    font-size:20px;
    padding-left:3px;
    box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.time-badge{
    position:absolute;
    z-index:3;
    right:10px;
    bottom:9px;
    background:rgba(0,0,0,.78);
    padding:4px 7px;
    border-radius:4px;
    font-size:11px;
}

.card-body{
    padding:16px;
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:315px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.map-tag{
    color:#cbd3df;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.7px;
    font-weight:700;
}

.region-tag{
    color:var(--red);
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
}

.matchup{
    font-size:20px;
    font-weight:800;
    line-height:1.15;
    margin-bottom:7px;
}

.matchup .vs{
    color:var(--muted);
    font-size:13px;
    margin:0 4px;
}

.player-link{
    color:white;
    cursor:pointer;
    transition:.2s;
}

.player-link:hover{
    color:var(--red);
}

.team-line{
    color:var(--muted);
    font-size:12px;
    margin-bottom:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tournament{
    min-height:35px;
    color:#d6dbe4;
    font-size:12px;
    line-height:1.4;
    margin-bottom:12px;
}

.tournament span{
    color:var(--muted);
}

.stats-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-top:auto;
    margin-bottom:14px;
}

.stat-mini{
    background:#0a0e14;
    border:1px solid #1d2531;
    border-radius:6px;
    padding:8px 5px;
    text-align:center;
}

.stat-mini b{
    display:block;
    font-size:14px;
}

.stat-mini span{
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
}

.card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-top:1px solid var(--border);
    padding-top:12px;
}

.agent-map{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.pill{
    background:#19202c;
    border:1px solid #293341;
    border-radius:5px;
    padding:5px 8px;
    color:#cbd3df;
    font-size:10px;
}

.card-actions{
    display:flex;
    gap:5px;
}

.empty{
    grid-column:1/-1;
    border:1px dashed #303a48;
    padding:55px 20px;
    border-radius:10px;
    text-align:center;
    color:var(--muted);
}

/* =========================
   PROFILE
========================= */

.profile-header{
    background:
        radial-gradient(circle at 90% 20%,rgba(255,70,85,.12),transparent 30%),
        linear-gradient(145deg,#111722,#0d121a);
    border:1px solid var(--border);
    border-radius:12px;
    padding:25px;
    margin-bottom:18px;
}

.back-row{
    margin-bottom:22px;
}

.profile-main{
    display:flex;
    align-items:center;
    gap:20px;
}

.avatar{
    width:82px;
    height:82px;
    flex:none;
    border-radius:10px;
    background:linear-gradient(145deg,#202938,#111722);
    border:1px solid #394656;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    font-weight:900;
    color:white;
}

.profile-name{
    margin:0;
    font-size:31px;
}

.profile-meta{
    color:var(--muted);
    margin-top:6px;
    font-size:13px;
}

.profile-counters{
    margin-left:auto;
    display:flex;
    gap:25px;
}

.profile-counter{
    text-align:center;
}

.profile-counter strong{
    display:block;
    font-size:24px;
}

.profile-counter span{
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
}

.profile-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.profile-stat{
    background:#111722;
    border:1px solid var(--border);
    border-radius:9px;
    padding:18px;
}

.profile-stat-label{
    color:var(--muted);
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:1px;
}

.profile-stat-value{
    font-size:25px;
    font-weight:800;
    margin-top:5px;
}

.profile-section{
    background:#111722;
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    margin-bottom:18px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.section-title h3{
    margin:0;
    font-size:16px;
}

.section-title span{
    color:var(--muted);
    font-size:11px;
}

.table-wrap{
    overflow-x:auto;
}

.data-table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

.data-table th{
    text-align:left;
    color:#7e8999;
    text-transform:uppercase;
    font-size:9px;
    letter-spacing:.8px;
    padding:9px 10px;
    border-bottom:1px solid var(--border);
}

.data-table td{
    padding:11px 10px;
    border-bottom:1px solid #1c2430;
    font-size:12px;
}

.data-table tr:last-child td{
    border-bottom:0;
}

.agent-name,
.map-name{
    font-weight:700;
}

.tournament-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.tournament-chip{
    background:#171e29;
    border:1px solid #2a3543;
    border-radius:20px;
    padding:7px 11px;
    font-size:11px;
    color:#d4dae3;
}

.profile-vods{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:15px;
}

.profile-vod{
    background:#0d121a;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
}

.profile-vod:hover{
    border-color:#435064;
}

.profile-vod-img{
    width:100%;
    height:125px;
    object-fit:cover;
    display:block;
}

.profile-vod-body{
    padding:11px;
}

.profile-vod-title{
    font-weight:700;
    font-size:13px;
}

.profile-vod-meta{
    color:var(--muted);
    font-size:10px;
    margin-top:5px;
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:min(1050px,100%);
    max-height:94vh;
    overflow:auto;
    background:#0d121a;
    border:1px solid #303a49;
    border-radius:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.modal-header{
    padding:17px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.modal-header h2{
    margin:0;
    font-size:17px;
}

.close{
    border:0;
    background:transparent;
    color:#9aa5b5;
    font-size:26px;
}

.close:hover{
    color:white;
}

.modal-content{
    padding:20px;
}

.video-container{
    aspect-ratio:16/9;
    background:#000;
    border-radius:7px;
    overflow:hidden;
}

.video-container iframe{
    width:100%;
    height:100%;
    border:0;
}

.vod-detail-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:15px;
}

.vod-detail{
    background:#111822;
    border:1px solid var(--border);
    border-radius:7px;
    padding:11px;
}

.vod-detail label{
    display:block;
    color:var(--muted);
    text-transform:uppercase;
    font-size:9px;
    margin-bottom:4px;
}

.vod-detail strong{
    font-size:12px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    color:#a9b2c0;
    font-size:11px;
    text-transform:uppercase;
}

.form-group input,
.form-group select{
    background:#090d13;
    color:white;
    border:1px solid var(--border);
    border-radius:6px;
    padding:10px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#526174;
}

.detected{
    color:var(--green);
    font-size:11px;
    min-height:15px;
}

.thumbnail-tools{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.thumbnail-preview{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:7px;
    border:1px solid var(--border);
    background:#080b10;
    margin-top:8px;
}

.modal-footer{
    padding:15px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

/* =========================
   LOADING
========================= */

.loading{
    color:var(--muted);
    padding:55px;
    text-align:center;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #27303d;
    border-top-color:var(--red);
    border-radius:50%;
    margin:0 auto 13px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){
    .vod-grid,
    .profile-vods{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .toolbar{
        grid-template-columns:2fr repeat(2,1fr);
    }

    .stats,
    .profile-stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){
    .header-inner{
        align-items:flex-start;
        flex-direction:column;
    }

    .header-actions{
        width:100%;
        justify-content:flex-start;
    }

    main{
        padding:18px 12px 40px;
    }

    .stats,
    .profile-stats{
        grid-template-columns:repeat(2,1fr);
    }

    .vod-grid,
    .profile-vods{
        grid-template-columns:1fr;
    }

    .toolbar{
        grid-template-columns:1fr;
    }

    .profile-main{
        align-items:flex-start;
        flex-wrap:wrap;
    }

    .profile-counters{
        margin-left:0;
        width:100%;
        justify-content:space-between;
    }

    .profile-name{
        font-size:25px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .vod-detail-grid{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="brand">
            <div class="brand-mark">V</div>

            <div>
                <h1>VCT <span>VOD HUB</span></h1>
                <p>Biblioteca de VODs competitivos de VALORANT</p>
            </div>
        </div>

        <div class="header-actions">

            <span class="status" id="authStatus">
                Visitante
            </span>

            <button
                class="btn btn-primary hidden"
                id="addVodBtn"
                onclick="abrirFormulario()">
                + Agregar VOD
            </button>

            <button
                class="btn hidden"
                id="logoutBtn"
                onclick="cerrarSesion()">
                Cerrar sesión
            </button>

            <button
                class="btn"
                id="loginBtn"
                onclick="abrirLogin()">
                Administrador
            </button>

        </div>

    </div>
</header>


<main>

    <!-- ESTADÍSTICAS GENERALES -->

    <section class="stats">

        <div class="stat">
            <div class="stat-label">VODs</div>
            <div class="stat-value" id="statVods">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Jugadores</div>
            <div class="stat-value" id="statPlayers">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Agentes</div>
            <div class="stat-value" id="statAgents">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Mapas</div>
            <div class="stat-value" id="statMaps">0</div>
        </div>

    </section>


    <!-- NAVEGACIÓN -->

    <nav class="main-nav">

        <button
            class="nav-btn active"
            id="navVods"
            onclick="mostrarVods()">
            VODs
        </button>

        <button
            class="nav-btn"
            id="navPlayers"
            onclick="mostrarJugadores()">
            Jugadores
        </button>

    </nav>


    <!-- =========================
         VISTA VODS
    ========================== -->

    <section id="vodView">

        <div class="toolbar">

            <input
                id="search"
                class="control"
                type="text"
                placeholder="Buscar jugador, equipo, torneo, mapa..."
                oninput="render()">

            <select
                id="filterAgent"
                class="control"
                onchange="render()">
                <option value="">Todos los agentes</option>
            </select>

            <select
                id="filterMap"
                class="control"
                onchange="render()">
                <option value="">Todos los mapas</option>
            </select>

            <select
                id="filterRegion"
                class="control"
                onchange="render()">
                <option value="">Todas las regiones</option>
            </select>

            <select
                id="sortBy"
                class="control"
                onchange="render()">
                <option value="recent">Más recientes</option>
                <option value="rating">Rating</option>
                <option value="acs">ACS</option>
                <option value="kills">Kills</option>
            </select>

            <button
                class="btn"
                onclick="limpiarFiltros()">
                Limpiar
            </button>

        </div>


        <div
            id="vodGrid"
            class="vod-grid">

            <div class="empty">
                <div class="spinner"></div>
                Cargando VODs...
            </div>

        </div>

    </section>


    <!-- =========================
         VISTA JUGADORES
    ========================== -->

    <section id="playersView" class="hidden">

        <div class="profile-section">

            <div class="section-title">
                <h3>Jugadores registrados</h3>
                <span id="playersCountText"></span>
            </div>

            <div
                id="playersTable"
                class="table-wrap">
            </div>

        </div>

    </section>


    <!-- =========================
         PERFIL JUGADOR
    ========================== -->

    <section
        id="profileView"
        class="hidden">

        <div id="profileContent"></div>

    </section>

</main>


<!-- =========================
     MODAL VOD
========================= -->

<div
    id="vodModal"
    class="modal hidden"
    onclick="cerrarModalOverlay(event,'vodModal')">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="vodModalTitle">
                VOD
            </h2>

            <button
                class="close"

async function cargarVods(){

    `;


    const {

        error
    } =
        await supabaseClient
            .from("vods")
            .select("*")
            .order(

                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            "Error Supabase:",
            error
        );

        grid.innerHTML = `

        `;

    vods =
        (data || [])

function convertirVod(v){

    return {

        id:v.id,

        url:v.url || "",

        youtubeId:
            v.youtube_id ||
            extraerYoutubeId(v.url || ""),

        startSeconds:
            Number(v.start_seconds) || 0,

        startTime:
            v.start_time || "",

        player:
            v.player || "",

        team:
            v.team || "",

        opponent:
            v.opponent || "",

        region:
            v.region || "",

        agent:
            v.agent || "",

        map:
            v.map || "",

        tournament:
            v.tournament || "",

        date:
            v.date || "",

        thumbnailUrl:
            v.thumbnail_url || "",

        kills:
            numero(v.kills),

        deaths:
            numero(v.deaths),

        assists:
            numero(v.assists),

        acs:
            numero(v.acs),

        rating:
            numero(v.rating),

        kast:
            numero(v.kast),

        createdAt:
            v.created_at || ""

    };

}


function numero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return null;

    }

    const n =
        Number(valor);

    return Number.isFinite(n)
        ? n
        : null;

}

function actualizarEstadisticas(){

    const agents =

    const maps =

            players.add(normalizar(v.player));

        if(v.agent)
            agents.add(normalizar(v.agent));

        if(v.map)
            maps.add(normalizar(v.map));

    });


    document
        .getElementById("statPlayers")
        .textContent =
            players.size;

    document
        .getElementById("statAgents")
        .textContent =
            agents.size;

    document
        .getElementById("statMaps")
        .textContent =
            maps.size;

}

function actualizarFiltros(){

    llenarFiltro(

    );

    llenarFiltro(
        "filterMap",
        obtenerValoresUnicos("map"),

    );

    llenarFiltro(
        "filterRegion",
        obtenerValoresUnicos("region"),
        "Todas las regiones"
    );

}


function obtenerValoresUnicos(campo){

    const mapa =
        new Map();

    vods.forEach(v => {

        const valor =
            String(v[campo] || "").trim();

        if(!valor)
            return;

        const key =
            normalizar(valor);

        if(!mapa.has(key))
            mapa.set(key,valor);

    });

    return Array.from(
        mapa.values()
    ).sort(
        (a,b) =>
            a.localeCompare(
                b,
                "es",
                {sensitivity:"base"}
            )
    );

}


function llenarFiltro(
    id,
    valores,
    placeholder
){

    const select =
        document.getElementById(id);

    const anterior =
        select.value;


    select.innerHTML =
        `<option value="">${escapeHtml(placeholder)}</option>`;


    valores.forEach(valor => {

        const option =
            document.createElement("option");

        option.value =
            valor;

        option.textContent =
            valor;

        select.appendChild(option);

    });


    if(
        valores.includes(anterior)
    ){

        select.value =
            anterior;

    }

}


function limpiarFiltros(){

function render(){

    if(vistaActual !== "vods")
        return;


    const grid =
        document.getElementById("vodGrid");

    const search =
        normalizar(
            document
                .getElementById("search")
                .value
        );


    const agent =
        normalizar(
            document
                .getElementById("filterAgent")
                .value
        );

    const map =
        normalizar(
            document
                .getElementById("filterMap")
                .value
        );

    const region =
        normalizar(
            document
                .getElementById("filterRegion")
                .value
        );


    let lista =
        vods.filter(v => {

            const texto =
                normalizar(
                    [
                        v.player,
                        v.team,
                        v.opponent,
                        v.region,
                        v.agent,
                        v.map,
                        v.tournament
                    ].join(" ")
                );


            return (

                (!search ||
                    texto.includes(search))

                &&

                (!agent ||
                    normalizar(v.agent) === agent)

                &&

                (!map ||
                    normalizar(v.map) === map)

                &&

                (!region ||
                    normalizar(v.region) === region)

            );

        });


    const sort =
        document
            .getElementById("sortBy")
            .value;


    if(sort === "rating"){

        lista.sort(
            (a,b) =>
                (b.rating ?? -Infinity) -
                (a.rating ?? -Infinity)
        );

    }else if(sort === "acs"){

        lista.sort(
            (a,b) =>
                (b.acs ?? -Infinity) -
                (a.acs ?? -Infinity)
        );

    }else if(sort === "kills"){

        lista.sort(
            (a,b) =>
                (b.kills ?? -Infinity) -
                (a.kills ?? -Infinity)
        );

    }else{

        lista.sort(
            (a,b) =>
                new Date(b.createdAt || b.date || 0) -
                new Date(a.createdAt || a.date || 0)
        );

    }


    if(!lista.length){

        grid.innerHTML = `
            <div class="empty">
                No se encontraron VODs con los filtros actuales.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        lista
            .map(crearCardVod)
            .join("");

}

function agruparPorCampo(lista,campo){

    const grupos =
        new Map();


    lista.forEach(v => {

        const nombre =
            String(v[campo] || "").trim() ||
            "Sin especificar";


        const key =
            normalizar(nombre);


        if(!grupos.has(key)){

            grupos.set(
                key,
                {
                    nombre,
                    vods:[]
                }
            );

        }


        grupos
            .get(key)
            .vods
            .push(v);

    });


    return Array.from(
        grupos.values()
    )
    .sort(
        (a,b) =>
            b.vods.length -
            a.vods.length
    )
    .map(g => {

        g.resumen =
            calcularResumen(g.vods);

        return g;

    });

}


function calcularResumen(lista){

    let kills = 0;
    let deaths = 0;
    let assists = 0;

    let acsTotal = 0;
    let acsCount = 0;

    let ratingTotal = 0;
    let ratingCount = 0;

    let kastTotal = 0;
    let kastCount = 0;


    lista.forEach(v => {

        if(v.kills !== null)
            kills += v.kills;

        if(v.deaths !== null)
            deaths += v.deaths;

        if(v.assists !== null)
            assists += v.assists;


        if(v.acs !== null){

            acsTotal += v.acs;
            acsCount++;

        }


        if(v.rating !== null){

            ratingTotal += v.rating;
            ratingCount++;

        }


        if(v.kast !== null){

            kastTotal += v.kast;
            kastCount++;

        }

    });


    return {

        kills,

        deaths,

        assists,

        acs:
            acsCount
                ? acsTotal / acsCount
                : null,

        rating:
            ratingCount
                ? ratingTotal / ratingCount
                : null,

        kast:
            kastCount
                ? kastTotal / kastCount
                : null

    };

}

                    .eq("id",editId);

        }else{

            resultado =
                await supabaseClient
                    .from("vods")
                    .insert([registro]);

        }


        if(resultado.error){

            console.error(
                resultado.error
            );

            if(
                resultado.error.code ===
                "42501"
            ){

                alert(
                    "Supabase rechazó la operación por permisos RLS."
                );

            }else{

                alert(
                    "Error guardando el VOD:\n" +
                    resultado.error.message
                );

            }

            return;

        }


        cerrarModal("formModal");

        await cargarVods();


    }finally{

        boton.disabled = false;

        boton.textContent =
            "Guardar VOD";

    }

}

/* =========================================================
   YOUTUBE
========================================================= */

function extraerYoutubeId(url){

    if(!url)
        return "";


    try{

        const u =
            new URL(url);


        const host =
            u.hostname
                .replace("www.","")
                .toLowerCase();


        if(host === "youtu.be"){

            return u.pathname
                .split("/")
                .filter(Boolean)[0] || "";

        }


        if(
            host === "youtube.com" ||
            host === "m.youtube.com"
        ){

            if(
                u.pathname === "/watch"
            ){

                return u.searchParams.get("v") || "";

            }


            if(
                u.pathname.startsWith("/shorts/")
            ){

                return u.pathname
                    .split("/")[2] || "";

            }


            if(
                u.pathname.startsWith("/embed/")
            ){

                return u.pathname
                    .split("/")[2] || "";

            }


            if(
                u.pathname.startsWith("/live/")
            ){

                return u.pathname
                    .split("/")[2] || "";

            }

        }

    }catch(e){

        return "";

    }


    return "";

}


function detectarTiempo(){

    const url =
        document
            .getElementById("vodUrl")
            .value
            .trim();


    const detectado =
        extraerTiempoUrl(url);


    document
        .getElementById(

        )
        .value =

    document
        .getElementById(
            "detectedTime"
        )
        .textContent =
            detectado > 0
                ? `Tiempo detectado: ${segundosATiempo(detectado)}`
                : "No se detectó un tiempo de inicio. Se utilizará 0 segundos.";


}


function extraerTiempoUrl(url){

    if(!url)
        return 0;


    try{

        const u =
            new URL(url);


        const t =
            u.searchParams.get("t");


        if(!t)
            return 0;


        return tiempoASegundos(t);

    }catch(e){

        return 0;

    }

}


function tiempoASegundos(valor){

    if(
        valor === null ||
        valor === undefined
    )
        return 0;


    const texto =
        String(valor)
            .trim()
            .toLowerCase();


    if(/^\d+$/.test(texto)){

        return Number(texto);

    }


    const match =
        texto.match(
            /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/
        );


    if(match){

        return (
            Number(match[1] || 0) * 3600 +
            Number(match[2] || 0) * 60 +
            Number(match[3] || 0)
        );

    }


    if(texto.includes(":")){

        const partes =
            texto
                .split(":")
                .map(Number);


        if(
            partes.every(
                Number.isFinite
            )
        ){

            if(partes.length === 3){

                return (
                    partes[0] * 3600 +
                    partes[1] * 60 +
                    partes[2]
                );

            }


            if(partes.length === 2){

                return (
                    partes[0] * 60 +
                    partes[1]
                );

            }

        }

    }


    return 0;

}


function segundosATiempo(segundos){

    segundos =
        Math.max(
            0,
            Math.floor(
                Number(segundos) || 0
            )
        );


    const h =
        Math.floor(
            segundos / 3600
        );

    const m =
        Math.floor(
            (segundos % 3600) / 60
        );

    const s =
        segundos % 60;


    if(h > 0){

        return (
            String(h).padStart(2,"0") +
            ":" +
            String(m).padStart(2,"0") +
            ":" +
            String(s).padStart(2,"0")
        );

    }


    return (
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0")
    );

}


/* =========================================================
   MINIATURAS
========================================================= */

function previsualizarMiniatura(event){

    const archivo =
        event.target.files[0];


    if(!archivo)
        return;


    if(
        ![
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ].includes(
            archivo.type
        )
    ){

        alert(
            "Formato no permitido. Usa JPG, PNG, WEBP o GIF."
        );

        event.target.value = "";

        return;

    }


    if(
        archivo.size >
        5 * 1024 * 1024
    ){

        alert(
            "La miniatura no puede superar 5 MB."
        );

        event.target.value = "";

        return;

    }


    miniaturaArchivo =
        archivo;


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const preview =
                document.getElementById(
                    "thumbnailPreview"
                );

            preview.src =
                e.target.result;

            preview.classList.remove(
                "hidden"
            );

        };


    reader.readAsDataURL(
        archivo
    );

}


function usarMiniaturaYoutube(){

    const url =
        document
            .getElementById("vodUrl")
            .value
            .trim();


    const id =
        extraerYoutubeId(url);


    if(!id){

        alert(
            "Primero introduce una URL válida de YouTube."
        );

        return;

    }


    miniaturaArchivo =
        null;


    miniaturaActual =
        `https://img.youtube.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;


    const preview =
        document.getElementById(
            "thumbnailPreview"
        );


    preview.src =
        miniaturaActual;

    preview.classList.remove(
        "hidden"
    );

}


function quitarMiniatura(){

    miniaturaActual =
        "";

    miniaturaArchivo =
        null;


    document
        .getElementById(
            "thumbnailFile"
        )
        .value = "";


    const preview =
        document.getElementById(
            "thumbnailPreview"
        );


    preview.src = "";

    preview.classList.add(
        "hidden"
    );

}


async function subirMiniatura(
    archivo,
    youtubeId
){

    const extension =
        archivo.name
            .split(".")
            .pop()
            .toLowerCase();


    const nombre =
        "vod-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2) +
        "." +
        extension;


    const path =
        "vods/" +
        nombre;


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(THUMBNAIL_BUCKET)
            .upload(
                path,
                archivo,
                {
                    upsert:false,
                    contentType:
                        archivo.type
                }
            );


    if(error){

        throw new Error(
            "Error subiendo miniatura: " +
            error.message
        );

    }


    const {
        data
    } =
        supabaseClient
            .storage
            .from(THUMBNAIL_BUCKET)
            .getPublicUrl(path);


    return data.publicUrl;

}

        vods.find(
            v =>
                String(v.id) ===
                String(id)
        );

        confirm(
            `¿Eliminar el VOD de ${vod.player || "este jugador"}?\n\nEsta acción no se puede deshacer.`
        );

        return;


    const {
        error
    } =
        await supabaseClient
            .from("vods")
            .delete()
            .eq("id",id);

        alert(
            "Error eliminando el VOD:\n" +
            error.message
        );

        );

/* =========================================================

========================================================= */

function obtenerNombreCanonico(
    lista,
    nombre
){

    const encontrado =
        lista.find(
            v =>
                normalizar(v.player) ===
                normalizar(nombre)
        );


    return encontrado
        ? encontrado.player
        : nombre;

}


function obtenerValorMasComun(
    valores
){

    const mapa =
        new Map();


    valores.forEach(v => {

        const texto =
            String(v || "").trim();


        if(!texto)
            return;


        const key =
            normalizar(texto);


        if(!mapa.has(key)){

            mapa.set(
                key,
                {
                    valor:texto,
                    cantidad:0
                }
            );

        }


        mapa.get(key).cantidad++;

    });


    let mejor =
        null;


    mapa.forEach(item => {

        if(
            !mejor ||
            item.cantidad >
            mejor.cantidad
        ){

            mejor =
                item;

        }

    });


    return mejor
        ? mejor.valor
        : "";

}


function valoresUnicos(
    valores
){

    const mapa =
        new Map();


    valores.forEach(v => {

        const texto =
            String(v || "").trim();


        if(!texto)
            return;


        const key =
            normalizar(texto);


        if(!mapa.has(key)){

            mapa.set(
                key,
                texto
            );

        }

    });


    return Array.from(
        mapa.values()
    )
    .sort(
        (a,b) =>
            a.localeCompare(
                b,
                "es",
                {
                    sensitivity:"base"
                }
            )
    );

}


function obtenerIniciales(nombre){

    const partes =
        nombre
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(!partes.length)
        return "?";


    if(partes.length === 1){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        partes[0][0] +
        partes[partes.length - 1][0]
    )
    .toUpperCase();

}


/* =========================================================
   HELPERS GENERALES
========================================================= */

function normalizar(texto){

    return String(texto || "")
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase()
        .trim();

}


function formatearNumero(n){

    if(
        n === null ||
        n === undefined ||
        !Number.isFinite(Number(n))
    ){

        return "-";

    }


    return Number(n)
        .toLocaleString(
            "es-CO",
            {
                maximumFractionDigits:2
            }
        );

}


function mostrarNumero(n){

    if(n === null || n === undefined)
        return "-";


    return Number(n)
        .toFixed(2);

}


function mostrarKast(n){

    if(
        n === null ||
        n === undefined
    ){

        return "-";

    }


    const numero =
        Number(n);


    if(numero <= 1){

        return (
            (numero * 100)
                .toFixed(1) +
            "%"
        );

    }


    return (
        numero.toFixed(1) +
        "%"
    );

}


function formatearFecha(fecha){

    if(!fecha)
        return "";


    try{

        const d =
            new Date(
                fecha +
                (
                    fecha.length === 10
                    ? "T00:00:00"
                    : ""
                )
            );


        if(
            Number.isNaN(
                d.getTime()
            )
        )
            return fecha;


        return d.toLocaleDateString(
            "es-CO",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );

    }catch(e){

        return fecha;

    }

}


function escapeHtml(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(valor){

    return String(valor ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n");

}
